# FeeLLGood default configuration parameters.

# This file documents the default configuration parameters used by
# feeLLGood. It has the format and structure feeLLGood expects from the
# user-supplied configuration file. It can thus be used as a template.
#
# The file format is YAML. Everything after a ‘#’ character is a
# comment. Settings are organized in sections (YAML “objects”) which are
# defined by the indentation, e.g:
#
#   outputs:                # ‘outputs’ section
#     file_basename: foo    # a setting in the ‘outputs’ section
#   mesh:                   # ‘mesh’ section
#     filename: foo.msh     # a setting in the ‘mesh’ section
#     volume_regions:       # a sub-section of ‘mesh’
#       main_volume:        # a sub-section of ‘volume_regions’
#         Ae: 1.5e-11       # a setting in the ‘main_volume’ section
#
# For a short primer on the YAML syntax, see
# https://getopentest.org/reference/yaml-primer.html
#
# Some numeric values are unit-less, like the reduced magnetization. All
# other values are in SI units.
#
# Unit vectors need not be of unit length: they will be normalized by
# feeLLGood upon reading the file.

# The ‘outputs’ section defines what data will be saved by feeLLGood,
# and in which files.
outputs:

  # Directory where the output files will be stored. The default value
  # (.) means the working directory where the feeLLGood process is
  # started. If the directory does not exist, it will be created.
  directory: .

  # This string will be used as a prefix for the names of all generated
  # files. Defaults to the base name of the mesh file.
  file_basename:

  # The global quantities listed under ‘evol_columns’ will be saved to
  # the evolution file on this time step.
  evol_time_step: 5e-13

  # Time at which to terminate the simulation.
  final_time: 1e-10

  # Global quantities that should be periodically saved to the evolution
  # file. In addition to the defaults below, the following quantities
  # are also available:
  # - iter: iteration number
  # - dt: time step
  # - max_dm: maximum variation of the magnetization
  # - max_angle: maximum magnetization angle between adjacent nodes
  # - <dMx/dt>: average change rate of Mx
  # - <dMy/dt>: average change rate of My
  # - <dMz/dt>: average change rate of Mz
  # - E_aniso: anisotropy energy
  # - E_DMI_bulk: bulk DMI energy
  # - Hx: applied field along x
  # - Hy: applied field along y
  # - Hz: applied field along z
  # - jn_multiplier: multiplier of the normal current densities, see
  #   ‘spin_accumulation.jn_multiplier’ below
  # - Thiele_length: Thiele length along (Oz)
  evol_columns:
    - t         # time
    - <Mx>      # Average value of Mx
    - <My>      # Average value of My
    - <Mz>      # Average value of Mz
    - E_ex      # Exchange energy
    - E_demag   # Demagnetizing energy
    - E_zeeman  # Zeeman energy
    - E_tot     # Total energy

  # How often to save the magnetization configuration. This should be
  # either an integer that is interpreted in units of ‘evol_time_step’,
  # or the keyword ‘false’ which disables the feature.
  mag_config_every: 100

  # Arbitrary set of metadata items, in the form of "key: value" pairs,
  # that will be added to the header of every output file. Typical keys
  # are "Author", "Affiliation", "Licence".
  metadata:

# Description of the meshed object.
mesh:

  # Name of the file containing the mesh. As there is no valid default,
  # the user must provide this in their configuration file.
  filename:

  # Unit of length used in the mesh file, in meters.
  length_unit: 1e-9

  # Material parameters of the volume regions defined by the mesh. Each
  # region is defined as a subsection of ‘volume_regions’.
  volume_regions:

    # Defaults that apply to all regions. Note that ‘__default__’ is not
    # a valid region name: it is a placeholder for the defaults. In the
    # user-supplied configuration file, ‘__default__’ should be replaced
    # by the region name.
    __default__:

      # Exchange constant.
      Ae: 1e-11

      # DMI bulk constant, in J m^-2.
      DMI_bulk: 0

      # Saturation magnetization. Default is 1 T/μ₀.
      Ms: 795774.7

      # Second order magnetocrystalline anisotropy constant.
      K: 0

      # Unit vector defining the anisotropy axis.
      uk: [0, 0, 1]

      # Cubic magnetocrystalline anisotropy constant.
      K3: 0

      # Unit vectors along the principal directions of the cubic
      # anisotropy.
      ex: [1, 0, 0]
      ey: [0, 1, 0]
      ez: [0, 0, 1]

      # Dimensionless damping parameter.
      alpha_LLG: 0.5

      # Conductivity.
      sigma: 0

      # Density of states at the Fermi level, J^-1 m^-3: D0 = 2 sigma/(e^2 N0).
      # The spin accumulation s = mu_B N0 mu_s/2 being continuous between the
      # regions, the spin chemical potential mu_s is continuous only between
      # regions of the same dens_state (otherwise N0 mu_s is): give the same
      # dens_state to all the regions to have the continuity of mu_s of
      # Valet-Fert.
      dens_state: 0

      # Polarization rate, in [0, 1): beta = beta' = P in the spin current of
      # Zhang-Levy-Fert, the longitudinal spin diffusion being D0 (1 - P^2).
      P: 0

      # Diffusion length related to s-d coupling in a magnetic material.
      l_sd: 0

      # Spin diffusion length in a metal, magnetic or not (longitudinal in a
      # ferromagnet): 1/tau_sf = D0 (1 - P^2)/l_sf^2 in a magnetic material,
      # D0/l_sf^2 otherwise.
      l_sf: 0

  # Material parameters of the surface regions defined by the mesh.
  surface_regions:

    # Defaults that apply to all regions. Again, ‘__default__’ is a
    # placeholder, not a valid region name.
    __default__:

      # Whether the magnetic charges on this surface should be removed,
      # in order to simulate an infinite medium.
      suppress_charges: false

      # Second order surface anisotropy constant.
      Ks: 0

      # Unit vector along the surface anisotropy axis.
      uk: [0, 0, 1]

      # Fixed normal current density value (j.n) for the boundary conditions of
      # the electrostatic and the spin diffusion problems, in A/m^2, n being
      # the outward normal (a positive value makes the current leave the
      # sample). Multiplied by ‘spin_accumulation.jn_multiplier’.
      jn:

      # Fixed potential value for the boundary conditions of the
      # electrostatic problem.
      V:

      # polarization unit vector for spin diffusion problem boundary condition.
      uP: [0, 0, 1]

      # spin diffusion vector for spin diffusion problem boundary condition.
      s:

      # Spin injection through a polarizer stack F1 / thin spacer N (/ F2),
      # not meshed, instead of uP (Robin boundary condition, see
      # src/slonczewskiInterface.h). It requires jn, and excludes uP and s, on
      # the same surface. An interface is given by its resistance-area product
      # AR (Ohm m^2), its asymmetry gamma (Valet-Fert) and the real and
      # imaginary parts Gr, Gi of its mixing conductance G_up,down (Brataas et
      # al., S/m^2, e.g. about 0.5e15 for Co/Cu); they are converted with the
      # dens_state of the volume region bordering the surface. Example:
      # slonczewski:
      #   p: [0, 0, 1]   # magnetization of F1
      #   F1: {sigma: 4e6, P: 0.3, l_sf: 10e-9, thickness: 10e-9}  # optional
      #        # bulk of F1, thickness default .inf
      #   F1N: {AR: 0.5e-15, gamma: 0.75, Gr: 5e14, Gi: 0}  # interface F1/N,
      #        # Gi optional
      #   NF2: {AR: 0.3e-15, gamma: 0.6, Gr: 5e14, Gi: 0, transverse: sink}
      #        # optional interface N/F2, the surface being then magnetic;
      #        # without it, the condition does not depend on the magnetization
      #        # (meshed spacer). transverse: sink (default), the transverse
      #        # spin current through N/F2 depends on the spin accumulation of
      #        # the spacer only (circuit theory): G_up,down describes the whole
      #        # absorption, the sample only spreads it over l_sd; series, it
      #        # depends on s_N - s_F, the interface and the bulk of the sample
      #        # being two absorption resistances in series (G_up,down should
      #        # then be the part of the interface only)

# The initial magnetization can be provided as either:
# - the name of a file in feeLLGood’s format (‘.sol’ file)
# - an array of three expression depending on the Cartesian spatial
#   coordinates (x, y, z); the expression may be constants.
# - a JavaScript function returning the array [mx, my, mz], either of
#   (x, y, z), or of (x, y, z, regions) where ‘regions’ is the array of
#   the names of the volume regions the node belongs to (several names
#   for a node on an interface between regions), e.g.:
#     initial_magnetization: |
#       function(x, y, z, regions) {
#           if (regions.includes("top")) return [1, 0, 0];
#           return [0, 1, 0];
#       }
#   See examples/example8.py.
initial_magnetization: [0, 0, 1]

# Initial time of the simulation. Default is:
# - the time recorded in the ‘.sol’ file providing the initial
#   magnetization, if the initial magnetization was defined this way
# - zero otherwise
initial_time:

# “Recentering” is the process by which feeLLGood tries to artificially
# keep a domain wall in the center of the simulated volume by
# translating the magnetization vector field.
recentering:

  # Whether to enable recentering.
  enable: false

  # Direction along which to translate the magnetization field. Should
  # be either ‘X’, ‘Y’ or ‘Z’.
  direction: Z

  # Threshold on the absolute value of the reduced magnetization above
  # which to trigger the translation.
  threshold: 0.1

# Absorbing ends, to absorb the spin waves reaching the ends of a wire
# instead of reflecting them. Along ‘axis’, over ‘length’ at each end of
# the union of the selected volume regions (not at the ends of each of
# them), alpha_LLG increases up to alpha_max with the profile
#   alpha = alpha_LLG + (alpha_max - alpha_LLG) sin^2(pi/2 s/length),
# s being the depth in the zone, so that the slope vanishes at both
# boundaries of the zone. See dev-notes/spin_waves_absorbing_damping_factor.md.
absorbing_ends:

  # Whether to enable the absorbing ends. When this section is present in
  # the settings file without ‘enable’, the absorbing ends are enabled.
  enable: false

  # Axis of the wire. Should be either ‘X’, ‘Y’ or ‘Z’.
  axis: Z

  # Length of each absorbing zone, in meters. Required when enabled.
  length:

  # Damping at the two ends of the union of the selected regions.
  alpha_max: 1

  # Selected volume regions: the zones are at the two ends of their union
  # along the axis, and the damping is modified in these regions only.
  # Either a single region or a sequence of regions. Empty means all the
  # volume regions.
  regions: []

# Expressions of the applied field, as a function of t, the time in
# seconds. May be constants. They can call jn_multiplier(t), see
# ‘spin_accumulation.jn_multiplier’ below.
Bext: [0, 0, 0]

# Parameters for simulating a coupling to spin accumulation. The
# boundary conditions of the electrostatic problem are a constant
# potential on one surface, and a normal current density on one or
# several other surfaces. The material parameters are defined in
# mesh.volume_regions.
spin_accumulation:

  # Whether to enable computation of spin accumulation contribution.
  enable: false

  # Anisotropic spin diffusion in the magnetic regions (Zhang-Levy-Fert,
  # beta = beta' = P): the diffusion is D0 (1 - P^2) for the component of s
  # along m and D0 for the transverse ones, and 1/tau_sf = D0 (1 - P^2)/l_sf^2,
  # so that l_sf stays the longitudinal spin diffusion length. With false,
  # isotropic diffusion D0 and 1/tau_sf = D0/l_sf^2 (beta beta' = 0, as
  # before this option). The polarizer stack (slonczewski) does not depend on
  # it; the equivalence with Valet-Fert holds with true only.
  anisotropic_diffusion: true

  # Time-dependent factor by which all the fixed normal current
  # densities (mesh.surface_regions.<region name>.jn) are multiplied.
  # Either an expression as a function of t (the time in seconds) or a
  # JavaScript function expression of the single parameter t. Defaults to
  # the constant value 1. The expressions of Bext can call
  # jn_multiplier(t), e.g. for the Oersted field of the current, even when
  # the spin accumulation is disabled.
  jn_multiplier:

  # Output, at the start of the simulation, the electric potential at
  # each node, ignoring jn_multiplier (i.e. assuming jn_multiplier = 1),
  # in the file <file_basename>_V.sol of outputs.directory.
  V_file: false

# Parameters for the computation of the demagnetizing field.
demagnetizing_field_solver:

  # Number of threads to use. The value 0 means to match the number of
  # available processors (actually, hardware threads), as reported by
  # sysconf(_SC_NPROCESSORS_ONLN).
  nb_threads: 0

# Parameters of the solver.
finite_element_solver:

  # Maximum number of iteration for the biconjugate gradient algorithm.
  max(iter): 700

  # solver tolerance.
  tolerance: 1e-6

# Parameters for the integration of the dynamic equation.
time_integration:

  # Limit on the maximum variation of the reduced magnetization in a
  # single time step.
  max(du): 0.02

  # Minimal time step. If the solver cannot converge with this time
  # step, the simulation will be aborted.
  min(dt): 1e-16

  # Maximal time step.
  max(dt): 5e-13
